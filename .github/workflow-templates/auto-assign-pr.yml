# Auto assign configured users to every new pull request.

name: Auto Assign Copilot to PRs

on:
  pull_request:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      DEFAULT_PR_ASSIGNEES: ${{ vars.DEFAULT_PR_ASSIGNEES || 'copilot' }}
    steps:
      - name: Assign Copilot (or others) to new PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const assignees = (process.env.DEFAULT_PR_ASSIGNEES || "copilot")
              .split(",")
              .map((assignee) => assignee.trim())
              .filter(Boolean);

            if (assignees.length === 0) {
              console.log("No assignees configured via DEFAULT_PR_ASSIGNEES; skipping.");
              return;
            }

            const currentAssignees = context.payload.pull_request.assignees.map(u => u.login);
            if (!assignees.every(a => currentAssignees.includes(a))) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees
              });
              console.log(`Assigned ${assignees.join(", ")} to PR #${context.payload.pull_request.number}`);
            } else {
              console.log(`Already assigned: ${assignees.join(", ")} on PR #${context.payload.pull_request.number}`);
            }