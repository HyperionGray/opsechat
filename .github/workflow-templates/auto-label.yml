# Auto-label new issues with your default labels!
# Configure labels with repository variable DEFAULT_ISSUE_LABELS.

name: Auto Label New Issues

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      DEFAULT_ISSUE_LABELS: ${{ vars.DEFAULT_ISSUE_LABELS || 'triage,copilot' }}
    steps:
      - name: Add labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = (process.env.DEFAULT_ISSUE_LABELS || "triage,copilot")
              .split(",")
              .map((label) => label.trim())
              .filter(Boolean);

            if (labels.length === 0) {
              console.log("No labels configured via DEFAULT_ISSUE_LABELS; skipping.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels
            });
            console.log(`Applied labels to issue #${context.issue.number}: ${labels.join(", ")}`);