name: 'Setup Node and Playwright'
description: 'Set up Node.js with npm caching and install Playwright browsers'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    
    - name: Install Node dependencies
      shell: bash
      run: npm ci
    
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(node <<'EOF'
        const fs = require('fs');

        function readJson(path) {
          try {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch (error) {
            return null;
          }
        }

        const packageLock = readJson('package-lock.json');
        const packageJson = readJson('package.json');

        const version =
          packageLock?.packages?.['node_modules/@playwright/test']?.version ||
          packageLock?.packages?.['']?.devDependencies?.['@playwright/test'] ||
          packageJson?.devDependencies?.['@playwright/test'] ||
          '';

        process.stdout.write(String(version).replace(/^[^\d]*/, ''));
        EOF
        )

        if [ -z "$PLAYWRIGHT_VERSION" ]; then
          echo "Failed to determine Playwright version" >&2
          exit 1
        fi

        echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps
    
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps
