name: 'Setup Node and Playwright'
description: 'Set up Node.js with npm caching and install Playwright browsers'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    
    - name: Install Node dependencies
      shell: bash
      run: npm ci
    
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(node -p "const pkg = require('./package.json'); const version = pkg.devDependencies?.['@playwright/test'] || pkg.dependencies?.['@playwright/test']; if (!version) { throw new Error('Could not find @playwright/test in package.json'); } version.replace(/^[^0-9]*/, '')")
        echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps
    
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps
