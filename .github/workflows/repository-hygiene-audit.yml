name: Repository Hygiene Audit

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hygiene-audit:
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Run repository hygiene audit
        run: |
          mkdir -p .tmp/hygiene
          python3 scripts/repo_hygiene_audit.py \
            --root . \
            --report-path .tmp/hygiene/report.md \
            --summary-path .tmp/hygiene/summary.json

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: repository-hygiene-audit
          path: .tmp/hygiene/
          retention-days: 14

      - name: Create or update hygiene issue
        uses: actions/github-script@v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('.tmp/hygiene/summary.json', 'utf8'));
            const report = fs.readFileSync('.tmp/hygiene/report.md', 'utf8');

            const title = 'Repository Hygiene Audit Findings';
            const now = new Date().toISOString();
            const body = `## Repository Hygiene Audit

            Last run: ${now}

            ### Summary
            - Unfinished markers: ${summary.marker_count}
            - Stray files: ${summary.stray_file_count}
            - Empty files: ${summary.empty_file_count}
            - Nested duplicate directories: ${summary.nested_dir_count}
            - Total findings: ${summary.total_findings}

            ---

            ${report}
            `;

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues.data.find((issue) => issue.title === title);

            if (summary.total_findings === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `No hygiene findings detected on ${now}. Closing this issue.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              } else {
                console.log('No findings and no open hygiene issue to close.');
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Audit run on ${now}: findings remain (${summary.total_findings} total).`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation', 'repo-hygiene'],
            });
