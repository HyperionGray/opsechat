name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        run: pytest -q

  playwright-e2e:
    name: Playwright E2E
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Node and Playwright
        uses: ./.github/actions/setup-node-playwright
        with:
          node-version: '20'

      - name: Run Playwright smoke E2E set
        run: npx playwright test tests/basic.spec.js tests/workflow.e2e.spec.js --project=chromium-headless

  security-baseline:
    name: Security baseline
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip-audit -r requirements-dev.txt; fi

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
