name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests-matrix:
    name: python-tests-matrix (py${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python test suite
        run: pytest -q --maxfail=1

  python-tests:
    name: python-tests
    runs-on: [self-hosted, linux, x64, big]
    needs: python-tests-matrix
    timeout-minutes: 5
    steps:
      - name: Python matrix completed
        run: echo "All Python matrix jobs passed."

  playwright-e2e:
    name: playwright-e2e
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 25
    needs: python-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python for mock server
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Setup Node and Playwright
        uses: ./.github/actions/setup-node-playwright
        with:
          node-version: "20"

      - name: Run Playwright E2E test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  security-baseline:
    name: security-baseline
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 20
    needs: python-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Setup Node environment
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Python dependency vulnerability scan
        run: pip-audit --progress-spinner=off

      - name: JavaScript dependency vulnerability scan
        run: npm audit --audit-level=high
