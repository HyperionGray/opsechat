name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install test dependencies
        run: pip install pytest pytest-cov
      
      - name: Run tests with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    env:
      MAX_SERVER_RETRIES: 30
      SERVER_RETRY_DELAY: 1
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
      
      - name: Setup Node and Playwright
        uses: ./.github/actions/setup-node-playwright
      
      - name: Start mock server
        run: |
          cd tests
          echo "Starting mock server..."
          python mock_server.py &
          SERVER_PID=$!
          echo $SERVER_PID > mock_server.pid
          echo "Mock server started with PID: $SERVER_PID"
          
          # Wait for server to start with retries
          for i in $(seq 1 $MAX_SERVER_RETRIES); do
            if curl -f -s http://127.0.0.1:5001/ > /dev/null 2>&1; then
              echo "Mock server is responding after $i seconds"
              break
            fi
            if [ $i -eq $MAX_SERVER_RETRIES ]; then
              echo "Mock server failed to start after $MAX_SERVER_RETRIES seconds"
              if [ -f mock_server.pid ]; then
                kill $(cat mock_server.pid) 2>/dev/null || true
              fi
              exit 1
            fi
            echo "Waiting for server... ($i/$MAX_SERVER_RETRIES)"
            sleep $SERVER_RETRY_DELAY
          done
          
          # Additional health check
          echo "Performing health check..."
          curl -f http://127.0.0.1:5001/ || (echo "Health check failed" && exit 1)
          echo "Mock server is ready for testing"
      
      - name: Run Playwright tests
        run: npm run test:headless
      
      - name: Stop mock server
        if: always()
        run: |
          if [ -f tests/mock_server.pid ]; then
            kill $(cat tests/mock_server.pid) || true
            rm tests/mock_server.pid
          fi
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
      
      - name: Setup Node and Playwright
        uses: ./.github/actions/setup-node-playwright
      
      - name: Python dependency vulnerability scan
        uses: pypa/gh-action-pip-audit@v1.0.8
        with:
          inputs: requirements.txt requirements-dev.txt
      
      - name: Node.js security audit
        run: npm audit --audit-level=moderate
