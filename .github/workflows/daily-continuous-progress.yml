name: Daily Continuous Progress

on:
  schedule:
    # Daily at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  continuous-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Build repository hygiene report
        run: |
          python3 scripts/repo_hygiene_report.py \
            --repo-root . \
            --commits 12 \
            --max-items 30 \
            --output /tmp/repo-hygiene.md

      - name: Analyze repo and create progress issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueTitle = 'Daily Progress: ' + new Date().toISOString().split('T')[0];
            const report = fs.readFileSync('/tmp/repo-hygiene.md', 'utf8');
            
            // Check if issue already exists for today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation,continuous-progress'
            });
            
            const todayIssue = existingIssues.data.find(i => i.title === issueTitle);
            if (todayIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: report
              });
              console.log('Issue already exists for today, appended report:', todayIssue.html_url);
              return;
            }
            
            // Create new daily progress issue
            const body = `${report}
            
            ## Automation Follow-up Checklist
            
            - [ ] Close or complete any unfinished markers/stubs in active code paths
            - [ ] Pick one small feature aligned to recent commit direction
            - [ ] Execute one cleanup candidate (stale file, duplicate, or root clutter)
            - [ ] Update docs for any implemented feature or structural cleanup
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body,
              labels: ['automation', 'continuous-progress', 'copilot']
            });
            
            console.log('Created issue:', issue.data.html_url);
