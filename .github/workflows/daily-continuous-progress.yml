name: Daily Continuous Progress

on:
  schedule:
    # Daily at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      focus_area:
        description: "Optional focus area for this run"
        required: false
        default: ""
      extra_instructions:
        description: "Optional extra instruction appended to Copilot prompt"
        required: false
        default: ""
      force_new_issue:
        description: "Create a new issue even if one already exists today"
        required: false
        type: boolean
        default: false

jobs:
  continuous-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      DAILY_PROGRESS_LABELS: ${{ vars.DAILY_PROGRESS_LABELS || 'automation,continuous-progress,copilot' }}
      DAILY_PROGRESS_ASSIGNEES: ${{ vars.DAILY_PROGRESS_ASSIGNEES || 'copilot' }}
      DAILY_PROGRESS_TRIGGER_MENTION: ${{ vars.DAILY_PROGRESS_TRIGGER_MENTION || '@copilot' }}
      DAILY_PROGRESS_COMMENT_TEMPLATE: ${{ vars.DAILY_PROGRESS_COMMENT_TEMPLATE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze repo and create progress issue
        uses: actions/github-script@v7
        # Use GH_PAT so that issue creation events trigger other workflows
        # (GITHUB_TOKEN-generated events are suppressed by GitHub to prevent loops).
        # This also allows the Copilot coding agent to respond to the assignment.
        # NOTE: If GH_PAT is not configured this falls back to GITHUB_TOKEN, which
        # will NOT trigger the Copilot coding agent reliably. Ensure GH_PAT is set.
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split("T")[0];
            const baseIssueTitle = `Daily Progress: ${today}`;
            const inputs = context.payload.inputs || {};
            const focusArea = (inputs.focus_area || "").trim();
            const extraInstructions = (inputs.extra_instructions || "").trim();
            const forceNewIssue = String(inputs.force_new_issue || "false") === "true";
            const triggerSource = context.eventName === "workflow_dispatch" ? "manual" : "schedule";

            const parseCsv = (value, fallback) => {
              const source = (value || fallback || "").trim();
              return source.split(",").map((item) => item.trim()).filter(Boolean);
            };

            const labels = parseCsv(
              process.env.DAILY_PROGRESS_LABELS,
              "automation,continuous-progress,copilot"
            );
            const assignees = parseCsv(process.env.DAILY_PROGRESS_ASSIGNEES, "copilot");
            const mention = (process.env.DAILY_PROGRESS_TRIGGER_MENTION || "@copilot").trim() || "@copilot";

            let issueTitle = baseIssueTitle;
            if (forceNewIssue) {
              issueTitle = `${baseIssueTitle} (run ${context.runId})`;
            }

            // Check if issue already exists for today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "automation,continuous-progress"
            });

            const todayIssue = existingIssues.data.find((issue) => issue.title === baseIssueTitle);
            if (todayIssue) {
              console.log("Issue already exists for today:", todayIssue.html_url);

              if (!forceNewIssue && (focusArea || extraInstructions)) {
                const followup = [
                  `${mention} additional run context:`,
                  focusArea ? `- Focus area: ${focusArea}` : "",
                  extraInstructions ? `- Extra instructions: ${extraInstructions}` : ""
                ].filter(Boolean).join("\n");

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: todayIssue.number,
                  body: followup
                });
                console.log(`Added follow-up instructions to issue #${todayIssue.number}`);
              }

              if (!forceNewIssue) {
                return;
              }
            }

            if (labels.length === 0) {
              throw new Error("DAILY_PROGRESS_LABELS resolved to an empty list; at least one label is required.");
            }

            const contextLines = [
              "- Look at recent issues and PRs",
              "- Review README and documentation",
              "- Identify incomplete features or TODOs",
              "- Consider project structure and organization"
            ];
            if (focusArea) {
              contextLines.push(`- Focus area for this run: ${focusArea}`);
            }
            if (extraInstructions) {
              contextLines.push(`- Additional instruction: ${extraInstructions}`);
            }

            // Create new daily progress issue
            const body = `## Daily Continuous Progress

            This issue tracks continuous progress for ${today}.

            **Run metadata:**
            - Trigger source: ${triggerSource}
            - Workflow run: ${context.runId}

            **Context:**
            ${contextLines.join("\n")}
            `;

            const commentChecklist = [
              "Review recent commits and identify the natural direction of the project",
              "Suggest next logical improvements or features to implement",
              "Create actionable tasks that align with the project goals",
              "Prioritize quick wins and incremental progress"
            ];
            if (focusArea) {
              commentChecklist.push(`Pay special attention to this focus area: ${focusArea}`);
            }
            if (extraInstructions) {
              commentChecklist.push(`Apply this extra instruction: ${extraInstructions}`);
            }

            let commentBody = (process.env.DAILY_PROGRESS_COMMENT_TEMPLATE || "").trim();
            if (commentBody) {
              commentBody = commentBody
                .replaceAll("{{MENTION}}", mention)
                .replaceAll("{{FOCUS_AREA}}", focusArea || "General maintenance")
                .replaceAll("{{EXTRA_INSTRUCTIONS}}", extraInstructions);
            } else {
              commentBody = `${mention} please analyze the repository and:\n${commentChecklist.map((item, idx) => `${idx + 1}. ${item}`).join("\n")}`;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body,
              labels
            });

            console.log("Created issue:", issue.data.html_url);

            if (assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.data.number,
                assignees
              });
              console.log(`Assigned issue #${issue.data.number} to: ${assignees.join(", ")}`);
            } else {
              console.log("No assignees configured via DAILY_PROGRESS_ASSIGNEES; leaving issue unassigned.");
            }

            // Post a comment that explicitly mentions @copilot to trigger the
            // Copilot coding agent. Assignment alone may not be sufficient when
            // done via automation; a mention in a comment is the reliable trigger.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              body: commentBody
            });

            console.log("Triggered Copilot coding agent via comment on issue #" + issue.data.number);
