name: Daily Continuous Progress

on:
  schedule:
    # Daily at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  continuous-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate repository context
        run: python scripts/generate_daily_progress_context.py > /tmp/daily-progress-context.md

      - name: Analyze repo and create progress issue
        uses: actions/github-script@v7
        # Use GH_PAT so that issue creation events trigger other workflows
        # (GITHUB_TOKEN-generated events are suppressed by GitHub to prevent loops).
        # This also allows the Copilot coding agent to respond to the assignment.
        # NOTE: If GH_PAT is not configured this falls back to GITHUB_TOKEN, which
        # will NOT trigger the Copilot coding agent reliably. Ensure GH_PAT is set.
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const issueTitle = 'Daily Progress: ' + new Date().toISOString().split('T')[0];
            let contextMarkdown = '';
            try {
              contextMarkdown = fs.readFileSync('/tmp/daily-progress-context.md', 'utf8').trim();
            } catch (error) {
              console.log('No generated context file found, continuing with default prompt.');
            }
            
            // Check if issue already exists for today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation,continuous-progress'
            });
            
            const todayIssue = existingIssues.data.find(i => i.title === issueTitle);
            if (todayIssue) {
              console.log('Issue already exists for today:', todayIssue.html_url);
              return;
            }
            
            // Create new daily progress issue
            const body = `## Daily Continuous Progress
            
            This issue tracks continuous progress for ${new Date().toISOString().split('T')[0]}.
            
            **Context:**
            - Look at recent issues and PRs
            - Review README and documentation
            - Identify incomplete features or TODOs
            - Consider project structure and organization

            ${contextMarkdown || '_No automated context available for this run._'}
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body,
              labels: ['automation', 'continuous-progress', 'copilot']
            });
            
            console.log('Created issue:', issue.data.html_url);
            
            // Assign to copilot
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              assignees: ['copilot']
            });

            // Post a comment that explicitly mentions @copilot to trigger the
            // Copilot coding agent. Assignment alone may not be sufficient when
            // done via automation; a mention in a comment is the reliable trigger.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              body: `@copilot please analyze the repository and:
1. Review recent commits and identify the natural direction of the project
2. Use the automated repository context in the issue body to prioritize unfinished code markers and cleanup candidates
3. Suggest next logical improvements or features to implement
4. Create actionable tasks that align with the project goals
5. Prioritize quick wins and incremental progress`
            });

            console.log('Triggered Copilot coding agent via comment on issue #' + issue.data.number);
