name: Repository Hygiene

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Run repository hygiene checks
        run: |
          python3 scripts/repo_hygiene_check.py --strict
