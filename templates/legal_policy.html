<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ policy.title }} - opsechat</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='legal-policy.css') }}">
</head>
<body>
  <main class="policy-page">
    <header>
      <h1>{{ policy.title }}</h1>
      <p class="meta">
        Version: <strong>{{ policy.version }}</strong> |
        Effective Date: <strong>{{ policy.effective_date }}</strong> |
        Last Updated: <strong>{{ policy.last_updated }}</strong>
      </p>
      <p class="source">
        Source: <code>{{ policy.source }}</code>
      </p>
      <nav class="legal-nav" aria-label="Legal policy navigation">
        <a href="/terms">Terms</a>
        <a href="/aup">AUP</a>
        <a href="/privacy">Privacy</a>
        <a href="/policy/versions">Policy metadata (JSON)</a>
      </nav>
    </header>
    <section class="policy-content" aria-label="Policy text">
      <pre>{{ policy.content }}</pre>
    </section>
  </main>
</body>
</html>
