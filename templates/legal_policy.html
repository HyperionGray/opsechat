<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpSecChat - {{ policy_title }}</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Courier New", monospace;
            background: #000;
            color: #0f0;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid #0f0;
            padding: 24px;
            background: #001100;
        }
        h1 {
            margin-top: 0;
            border-bottom: 1px solid #0f0;
            padding-bottom: 12px;
        }
        .policy-text {
            white-space: pre-wrap;
        }
        .policy-links {
            margin-top: 24px;
            border-top: 1px solid #0a0;
            padding-top: 12px;
            font-size: 14px;
        }
        a {
            color: #0ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>{{ policy_title }}</h1>
        <section class="policy-text">{{ policy_text }}</section>
        <nav class="policy-links" aria-label="Policy navigation">
            <a href="/terms">Terms</a> |
            <a href="/aup">Acceptable Use</a> |
            <a href="/privacy">Privacy</a>
        </nav>
    </main>
</body>
</html>
