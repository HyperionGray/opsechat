<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpSecChat - {{ policy_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='legal-policy.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ policy_title }}</h1>
        <p class="subtitle">Public policy document for OpSecChat.</p>
        <div class="policy-body">{{ policy_markdown }}</div>
        <p class="policy-links">
            <a href="/terms" class="{% if policy_slug == 'terms' %}active{% endif %}">Terms</a>
            <a href="/aup" class="{% if policy_slug == 'aup' %}active{% endif %}">AUP</a>
            <a href="/privacy" class="{% if policy_slug == 'privacy' %}active{% endif %}">Privacy</a>
        </p>
    </div>
</body>
</html>
