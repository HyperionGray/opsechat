<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpSecChat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 10px 20px;
            border-bottom: 1px solid #0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 1.2em;
            color: #0f0;
        }
        
        .header-info {
            font-size: 0.9em;
        }
        
        .encryption-toggle {
            margin-left: 20px;
        }
        
        .encryption-toggle label {
            cursor: pointer;
        }
        
        .encryption-toggle input {
            margin-right: 5px;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .message .username {
            font-weight: bold;
            margin-right: 5px;
        }
        
        .message.mine {
            text-align: right;
        }
        
        .message.mine .username:after {
            content: " (you)";
            font-size: 0.8em;
            opacity: 0.7;
        }
        
        .message .lock-icon {
            margin-right: 3px;
        }
        
        .input-container {
            border-top: 1px solid #0f0;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
        }
        
        .input-container input {
            flex: 1;
            background-color: #001100;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
        }
        
        .input-container input:focus {
            outline: none;
            box-shadow: 0 0 10px #0f0;
        }
        
        .input-container button {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
        }
        
        .input-container button:hover {
            background-color: #0d0;
        }
        
        .input-container button:active {
            transform: scale(0.95);
        }
        
        .status {
            font-size: 0.8em;
            color: #ff0;
            margin-top: 5px;
        }
        
        .encryption-status {
            color: #0ff;
            font-size: 0.9em;
        }
        
        .encryption-status.enabled {
            color: #0f0;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #001100;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0f0;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #0d0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🔒 OpSecChat Room</h1>
            <span id="userInfo">You are: <span style="color: rgb({{ color[0] }}, {{ color[1] }}, {{ color[2] }})">{{ username }}</span></span>
        </div>
        <div class="header-info">
            <span id="userCount">Users: 1</span>
            <span class="encryption-toggle">
                <label>
                    <input type="checkbox" id="encryptionToggle">
                    <span id="encryptionStatus" class="encryption-status">Encryption: OFF</span>
                </label>
            </span>
        </div>
    </div>
    
    <div class="messages-container" id="messagesContainer">
        <!-- Messages will appear here -->
    </div>
    
    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Type your message..." maxlength="1000" autofocus>
        <button id="sendBtn">Send</button>
    </div>
    <div class="status" id="statusMsg"></div>
    
    <script>
        // Simple E2E encryption using Web Crypto API (reviewable and minimal)
        const roomId = "{{ room_id }}";
        let encryptionEnabled = false;
        let encryptionKey = null;
        let pollInterval = null;
        
        // Simple encryption using AES-GCM with Web Crypto API
        async function generateKey() {
            const key = await window.crypto.subtle.generateKey(
                {
                    name: "AES-GCM",
                    length: 256
                },
                true,
                ["encrypt", "decrypt"]
            );
            return key;
        }
        
        async function exportKey(key) {
            const exported = await window.crypto.subtle.exportKey("raw", key);
            return Array.from(new Uint8Array(exported));
        }
        
        async function importKey(keyArray) {
            const key = await window.crypto.subtle.importKey(
                "raw",
                new Uint8Array(keyArray),
                {
                    name: "AES-GCM",
                    length: 256
                },
                true,
                ["encrypt", "decrypt"]
            );
            return key;
        }
        
        async function encryptMessage(message, key) {
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(message);
            
            const encrypted = await window.crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                key,
                encoded
            );
            
            // Combine IV and encrypted data
            const combined = new Uint8Array(iv.length + encrypted.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(encrypted), iv.length);
            
            // Return as base64
            return btoa(String.fromCharCode(...combined));
        }
        
        async function decryptMessage(encryptedMessage, key) {
            try {
                // Decode from base64
                const combined = Uint8Array.from(atob(encryptedMessage), c => c.charCodeAt(0));
                
                // Extract IV and encrypted data
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);
                
                const decrypted = await window.crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    key,
                    data
                );
                
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return "[Decryption failed]";
            }
        }
        
        function isEncrypted(message) {
            return message.startsWith("🔒");
        }
        
        // UI functions
        function showStatus(message, duration = 3000) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = message;
            setTimeout(() => {
                statusMsg.textContent = '';
            }, duration);
        }
        
        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }
        
        async function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            for (const msg of messages) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message' + (msg.is_mine ? ' mine' : '');
                
                const usernameSpan = document.createElement('span');
                usernameSpan.className = 'username';
                usernameSpan.style.color = `rgb(${msg.color[0]}, ${msg.color[1]}, ${msg.color[2]})`;
                usernameSpan.textContent = msg.username + ':';
                
                const messageText = document.createElement('span');
                
                // Check if message is encrypted
                if (isEncrypted(msg.message)) {
                    const lockIcon = document.createElement('span');
                    lockIcon.className = 'lock-icon';
                    lockIcon.textContent = '🔒 ';
                    messageText.appendChild(lockIcon);
                    
                    if (encryptionEnabled && encryptionKey) {
                        const encryptedData = msg.message.substring(1); // Remove lock emoji
                        const decrypted = await decryptMessage(encryptedData, encryptionKey);
                        messageText.appendChild(document.createTextNode(decrypted));
                    } else {
                        messageText.appendChild(document.createTextNode('[Encrypted - Enable encryption to view]'));
                    }
                } else {
                    messageText.textContent = msg.message;
                }
                
                messageDiv.appendChild(usernameSpan);
                messageDiv.appendChild(document.createTextNode(' '));
                messageDiv.appendChild(messageText);
                
                container.appendChild(messageDiv);
            }
            
            scrollToBottom();
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            let messageToSend = message;
            
            // Encrypt if enabled
            if (encryptionEnabled && encryptionKey) {
                messageToSend = '🔒' + await encryptMessage(message, encryptionKey);
            }
            
            try {
                const response = await fetch(`/chat/room/${roomId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: messageToSend })
                });
                
                if (response.ok) {
                    input.value = '';
                    await pollMessages();
                } else {
                    showStatus('Error sending message');
                }
            } catch (error) {
                showStatus('Error: ' + error.message);
            }
        }
        
        async function pollMessages() {
            try {
                const response = await fetch(`/chat/room/${roomId}/messages`);
                
                if (response.ok) {
                    const data = await response.json();
                    await renderMessages(data.messages);
                    document.getElementById('userCount').textContent = `Users: ${data.user_count}`;
                }
            } catch (error) {
                // Silently fail for polling errors
            }
        }
        
        // Event listeners
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        document.getElementById('encryptionToggle').addEventListener('change', async function(e) {
            encryptionEnabled = e.target.checked;
            const statusSpan = document.getElementById('encryptionStatus');
            
            if (encryptionEnabled) {
                if (!encryptionKey) {
                    // Generate new key
                    encryptionKey = await generateKey();
                    const keyArray = await exportKey(encryptionKey);
                    
                    // Store in sessionStorage for this tab only
                    sessionStorage.setItem(`chatroom_${roomId}_key`, JSON.stringify(keyArray));
                    
                    showStatus('Encryption enabled. Share this room URL only with trusted contacts who also enable encryption.');
                }
                statusSpan.textContent = 'Encryption: ON';
                statusSpan.className = 'encryption-status enabled';
            } else {
                statusSpan.textContent = 'Encryption: OFF';
                statusSpan.className = 'encryption-status';
            }
            
            // Re-render messages with new encryption status
            await pollMessages();
        });
        
        // Check for existing key on load
        window.addEventListener('load', async function() {
            const storedKey = sessionStorage.getItem(`chatroom_${roomId}_key`);
            if (storedKey) {
                try {
                    const keyArray = JSON.parse(storedKey);
                    encryptionKey = await importKey(keyArray);
                    document.getElementById('encryptionToggle').checked = true;
                    encryptionEnabled = true;
                    document.getElementById('encryptionStatus').textContent = 'Encryption: ON';
                    document.getElementById('encryptionStatus').className = 'encryption-status enabled';
                } catch (e) {
                    // Ignore invalid keys
                }
            }
            
            // Start polling
            await pollMessages();
            pollInterval = setInterval(pollMessages, 2000);
        });
        
        // Cleanup on unload
        window.addEventListener('beforeunload', function() {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
