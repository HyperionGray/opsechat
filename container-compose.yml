name: opsechat-mvp

services:
  admin-proxy:
    image: opsechat-admin-proxy:local
    build:
      context: .
      dockerfile: containers/proxy.Dockerfile
    container_name: opsechat-admin-proxy
    depends_on:
      opsechat:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8087"
    networks:
      - admin-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8087/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  tor:
    image: opsechat-tor:local
    build:
      context: .
      dockerfile: containers/tor.Dockerfile
    container_name: opsechat-tor
    command: ["tor", "-f", "/etc/tor/torrc"]
    volumes:
      - ./containers/torrc:/etc/tor/torrc:ro
      - tor-data:/var/lib/tor
    networks:
      - opsechat-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  opsechat:
    build:
      context: .
      dockerfile: containers/Dockerfile
    container_name: opsechat-app
    depends_on:
      tor:
        condition: service_healthy
    environment:
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_HOST: tor
      TOR_SOCKS_PORT: "9050"
      TOR_SOCKS_HOST: tor
      OPSECHAT_REQUIRE_TOR: "1"
      OPSECHAT_FORCE_TOR_EGRESS: "1"
      FLASK_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - tor-data:/var/lib/tor:ro
    # No app host ports by default. Use the onion service or the localhost-only
    # admin proxy on 127.0.0.1:8087.
    # For direct localhost debugging only, uncomment:
    # ports:
    #   - "127.0.0.1:5000:5000"
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    networks:
      - admin-network
      - opsechat-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    stdin_open: true
    tty: true

networks:
  admin-network:
    driver: bridge
  opsechat-network:
    driver: bridge

volumes:
  tor-data:
