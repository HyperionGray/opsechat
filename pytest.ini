[pytest]
# pytest configuration for OpSecChat alpha
#
# Default invocation runs ONLY tests under the alpha-shipping surface.
# Legacy / extended-profile tests are still in the tree but require explicit
# opt-in via --override-ini "addopts=" or `-m legacy`.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Skip legacy / extended-services-only suites by default. They remain runnable
# via:  pytest tests/test_email_system.py  (or similar explicit invocation).
addopts =
    --tb=short
    --ignore=tests/test_email_system.py
    --ignore=tests/test_email_routes_admin.py
    --ignore=tests/test_email_security_tools.py
    --ignore=tests/test_email_transport.py
    --ignore=tests/test_http_mail.py
    --ignore=tests/test_http_mail_routes_regression.py
    --ignore=tests/test_domain_manager.py
    --ignore=tests/test_new_features.py
    --ignore=tests/manual

markers =
    alpha: tests for the alpha-shipping surface (default scope)
    legacy: tests for legacy / extended-profile features (off-by-default)
    slow: tests that intentionally sleep beyond a few seconds
