<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpSecChat - Error</title>
    <link rel="stylesheet" href="/static/simple-chat-error.css">
</head>
<body>
    <main class="layout error-layout" role="main">
        <section class="panel error-container">

    </main>

</html>
